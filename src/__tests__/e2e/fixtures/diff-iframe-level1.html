<!DOCTYPE html>
<html>
<head>
  <title>Diff iframe Level 1</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    iframe { width: 100%; height: 300px; border: 1px solid #999; margin-top: 15px; }
    button { padding: 8px 16px; cursor: pointer; margin: 5px; }
    input { padding: 8px; width: 200px; }
  </style>
</head>
<body>
  <h2>Level 1 iframe</h2>
  <p id="level1-counter">Level1 Counter: 0</p>
  <input type="text" id="level1-input" placeholder="Level 1 input">
  <button id="level1-btn" onclick="incrementLevel1()">Level 1 Button</button>
  <button id="level1-fill-btn" onclick="fillLevel1()">Fill Input</button>
  <button id="level1-toggle" onclick="toggleLevel1Secret()">Toggle Level1 Secret</button>
  <p id="level1-secret" style="display:none">Level 1 Secret!</p>
  <iframe id="frame2" src="diff-iframe-level2.html"></iframe>
  
  <script>
    let level1Count = 0;
    
    function incrementLevel1() {
      level1Count++;
      document.getElementById('level1-counter').textContent = 'Level1 Counter: ' + level1Count;
    }
    
    function fillLevel1() {
      document.getElementById('level1-input').value = 'Filled from Level 1 button';
    }
    
    function toggleLevel1Secret() {
      const secret = document.getElementById('level1-secret');
      secret.style.display = secret.style.display === 'none' ? 'block' : 'none';
    }
  </script>
</body>
</html>
