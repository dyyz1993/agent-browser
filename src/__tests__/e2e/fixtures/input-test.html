<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
    }
    #output {
      margin-top: 20px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 4px;
      min-height: 40px;
    }
    #event-log {
      margin-top: 20px;
      padding: 12px;
      background: #1a1a2e;
      color: #4ecca3;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Input Test Page</h1>
  
  <div class="form-group">
    <label for="text-input">Text Input</label>
    <input type="text" id="text-input" placeholder="Type here...">
  </div>
  
  <div class="form-group">
    <label for="password-input">Password Input</label>
    <input type="password" id="password-input" placeholder="Password...">
  </div>
  
  <div class="form-group">
    <label for="email-input">Email Input</label>
    <input type="email" id="email-input" placeholder="email@example.com">
  </div>
  
  <div class="form-group">
    <label for="number-input">Number Input</label>
    <input type="number" id="number-input" placeholder="123">
  </div>
  
  <div class="form-group">
    <label for="textarea">Textarea</label>
    <textarea id="textarea" rows="4" placeholder="Multi-line text..."></textarea>
  </div>
  
  <div class="form-group">
    <label for="search-input">Search Input</label>
    <input type="search" id="search-input" placeholder="Search...">
  </div>
  
  <div id="output">
    <strong>Current value:</strong> <span id="value-display">(empty)</span>
  </div>
  
  <div id="event-log">
    <div>Event log:</div>
  </div>
  
  <script>
    const textInput = document.getElementById('text-input');
    const valueDisplay = document.getElementById('value-display');
    const eventLog = document.getElementById('event-log');
    
    function logEvent(type, detail) {
      const entry = document.createElement('div');
      entry.textContent = `[${type}] ${detail}`;
      eventLog.appendChild(entry);
      eventLog.scrollTop = eventLog.scrollHeight;
    }
    
    textInput.addEventListener('input', (e) => {
      valueDisplay.textContent = e.target.value || '(empty)';
      logEvent('input', e.target.value);
    });
    
    textInput.addEventListener('keydown', (e) => {
      logEvent('keydown', `key=${e.key}, code=${e.code}`);
    });
    
    textInput.addEventListener('keyup', (e) => {
      logEvent('keyup', `key=${e.key}, code=${e.code}`);
    });
    
    textInput.addEventListener('compositionstart', () => {
      logEvent('compositionstart', '');
    });
    
    textInput.addEventListener('compositionend', (e) => {
      logEvent('compositionend', e.data);
    });
    
    textInput.addEventListener('paste', (e) => {
      logEvent('paste', 'pasted');
    });
    
    textInput.addEventListener('focus', () => {
      logEvent('focus', '');
    });
    
    textInput.addEventListener('blur', () => {
      logEvent('blur', '');
    });
  </script>
</body>
</html>
