<!DOCTYPE html>
<html><head><title>Captcha Test</title></head>
<body>
<div id="captcha-modal" class="captcha-verify" style="display:block; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999;">
  <div style="margin:200px auto; padding:20px; background:white; text-align:center;">
    <p>Please complete captcha verification</p>
    <button id="captcha-submit" onclick="resolveCaptcha()">I am not a robot</button>
  </div>
</div>
<script>
  function resolveCaptcha() {
    var modal = document.getElementById('captcha-modal');
    if (modal) modal.remove();
    document.getElementById('content').style.display = 'block';
  }
  setTimeout(function() {
    var modal = document.getElementById('captcha-modal');
    if (modal) {
      modal.remove();
      document.getElementById('content').style.display = 'block';
    }
  }, 3000);
</script>
<div id="content" style="display:none">
  <h1>Welcome! Content is now visible.</h1>
  <div class="data-item">Item 1</div>
  <div class="data-item">Item 2</div>
  <div class="data-item">Item 3</div>
</div>
</body></html>
