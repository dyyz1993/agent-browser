<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Item List</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .item-card { padding: 12px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
    .item-card:hover { background: #f5f5f5; }
    .item-card .name { font-weight: bold; }
    .item-card .snippet { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Products</h1>
  <div id="item-list">
    <div class="item-card" data-id="1">
      <div class="name">Widget Alpha</div>
      <div class="snippet">A versatile widget for all purposes</div>
    </div>
    <div class="item-card" data-id="2">
      <div class="name">Gadget Beta</div>
      <div class="snippet">Advanced gadget with smart features</div>
    </div>
    <div class="item-card" data-id="3">
      <div class="name">Tool Gamma</div>
      <div class="snippet">Precision tool for professional use</div>
    </div>
    <div class="item-card" data-id="4">
      <div class="name">Device Delta</div>
      <div class="snippet">Compact device with high performance</div>
    </div>
    <div class="item-card" data-id="5">
      <div class="name">Instrument Epsilon</div>
      <div class="snippet">Sensitive instrument for measurements</div>
    </div>
  </div>
</body>
</html>
