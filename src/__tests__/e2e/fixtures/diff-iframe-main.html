<!DOCTYPE html>
<html>
<head>
  <title>Diff iframe Main</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    iframe { width: 100%; height: 400px; border: 1px solid #ccc; margin-top: 20px; }
    button { padding: 10px 20px; cursor: pointer; }
    #main-counter { font-size: 24px; }
  </style>
</head>
<body>
  <h1>Main Page</h1>
  <p id="main-counter">Main Counter: 0</p>
  <button id="main-btn" onclick="incrementMain()">Main Button</button>
  <button id="main-toggle" onclick="toggleMainSecret()">Toggle Main Secret</button>
  <p id="main-secret" style="display:none">Main Secret Revealed!</p>
  <iframe id="frame1" src="diff-iframe-level1.html"></iframe>
  
  <script>
    let mainCount = 0;
    
    function incrementMain() {
      mainCount++;
      document.getElementById('main-counter').textContent = 'Main Counter: ' + mainCount;
    }
    
    function toggleMainSecret() {
      const secret = document.getElementById('main-secret');
      secret.style.display = secret.style.display === 'none' ? 'block' : 'none';
    }
  </script>
</body>
</html>
