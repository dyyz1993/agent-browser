<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recorder Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .test-section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .test-section h3 { margin-bottom: 10px; }
    input, button, select, textarea { margin: 5px; padding: 8px 12px; }
    button { cursor: pointer; }
    .link-section a { display: block; margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Recorder E2E Test Page</h1>
  
  <div class="test-section">
    <h3>Input Test</h3>
    <input type="text" id="text-input" data-testid="text-input" placeholder="Text input">
    <input type="password" id="password-input" data-testid="password-input" placeholder="Password">
    <input type="email" id="email-input" name="email" placeholder="Email">
    <textarea id="textarea" data-testid="textarea" placeholder="Textarea"></textarea>
  </div>
  
  <div class="test-section">
    <h3>Button Test</h3>
    <button id="btn-primary" data-testid="btn-primary" class="btn primary">Primary Button</button>
    <button id="btn-secondary" class="btn secondary">Secondary Button</button>
    <button id="btn-submit" type="submit">Submit Button</button>
  </div>
  
  <div class="test-section">
    <h3>Select Test</h3>
    <select id="select-single" data-testid="select-single" name="country">
      <option value="">Select country</option>
      <option value="us">United States</option>
      <option value="uk">United Kingdom</option>
      <option value="cn">China</option>
    </select>
  </div>
  
  <div class="test-section">
    <h3>Link Test</h3>
    <div class="link-section">
      <a href="https://example.com" id="cross-domain-link">External Link (Cross-Domain)</a>
      <a href="javascript:void(0)" id="js-link">JavaScript Link</a>
    </div>
    <div id="section1" style="margin-top: 200px; padding: 20px; background: #f5f5f5">
      <h3>Anchor Target Section</h3>
    </div>
  </div>
  
  <div class="test-section">
    <h3>Scroll Test</h3>
    <div style="height: 300px; overflow-y: scroll; border: 1px solid #ccc;">
      <div style="height: 1000px; padding: 10px;">
        <p>Scroll down to see more content...</p>
        <div style="margin-top: 500px;">
          <button id="scrolled-button" data-testid="scrolled-button">Button after scroll</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
