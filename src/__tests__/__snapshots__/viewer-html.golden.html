<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Browser Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
      overflow: hidden;
      position: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .toolbar {
      background: #16213e;
      padding: 6px 12px;
      padding-top: max(6px, env(safe-area-inset-top, 0px));
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      min-height: 40px;
      overflow: hidden;
      position: relative;
      z-index: 100;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e94560;
      flex-shrink: 0;
    }
    .status.connected .status-dot { background: #4ecca3; }
    .url-display {
      flex: 1;
      min-width: 0;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: #eee;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .quality-badge {
      background: #0f3460;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      color: #4ecca3;
      flex-shrink: 0;
    }
    .record-btn {
      background: #1a4a5e;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .mode-btn {
      background: #2a2a4a;
      color: #4ecca3;
      border: 1px solid #4ecca3;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .mode-btn:hover { background: #1a4a5e; }
    .record-btn:hover { background: #1a4a7a; }
    .record-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e94560;
      flex-shrink: 0;
    }
    .record-btn.recording .record-dot { background: #4ecca3; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .recording .record-dot {
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .viewport {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: #111;
      flex: 1 1 auto;
      min-height: 0;
    }
    .screen-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    #screen {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .view-tabs {
      display: none;
      flex: 0 0 auto;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4e;
      padding: 2px 4px;
      overflow-x: auto;
      white-space: nowrap;
      gap: 2px;
      height: 28px;
      align-items: center;
      scrollbar-width: thin;
      scrollbar-color: #4a4a6e #1a1a2e;
      position: relative;
      z-index: 100;
    }
    .view-tabs::-webkit-scrollbar {
      height: 3px;
    }
    .view-tabs::-webkit-scrollbar-track {
      background: #1a1a2e;
    }
    .view-tabs::-webkit-scrollbar-thumb {
      background: #4a4a6e;
      border-radius: 2px;
    }
    .view-tabs.visible {
      display: flex;
    }
    .view-tab {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px 4px 0 0;
      background: #2a2a4e;
      color: #8af;
      font-size: 11px;
      cursor: pointer;
      border: none;
      font-family: inherit;
      max-width: 140px;
      overflow: hidden;
      position: relative;
      height: 28px;
    }
    .view-tab img {
      width: 36px;
      height: 22px;
      object-fit: cover;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .view-tab span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .view-tab.active {
      background: #0f3460;
      color: #cde;
      font-weight: 600;
    }
    .view-tab:active {
      background: #1a5276;
    }
    .view-tip {
      display: none;
      flex: 0 0 auto;
      background: #1a2a1a;
      border-bottom: 1px solid #2a4a2a;
      padding: 4px 8px;
      font-size: 11px;
      color: #8f8;
      align-items: center;
      gap: 6px;
      height: 22px;
      position: relative;
      z-index: 100;
    }
    .view-tip.visible {
      display: flex;
    }
    .view-tip::before {
      content: 'ℹ';
      font-size: 12px;
    }
    #cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: rgba(255, 0, 0, 0.9);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
      z-index: 1000;
      display: none;
      transition: width 0.15s, height 0.15s, background 0.15s, box-shadow 0.15s;
    }
    #cursor.cursor-move {
      background: rgba(68, 140, 255, 0.9);
      box-shadow: 0 0 8px rgba(68, 140, 255, 0.6);
    }
    #cursor.cursor-drag {
      background: rgba(255, 165, 0, 0.9);
      box-shadow: 0 0 10px rgba(255, 165, 0, 0.6);
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
    }
    #cursor.cursor-longpress {
      animation: cursorPulse 0.6s ease-in-out infinite;
    }
    @keyframes cursorPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.8); }
    }
    .connecting {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }
    .connecting-card {
      background: rgba(22, 33, 62, 0.95);
      border: 1px solid #4ecca3;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 8px 32px rgba(78, 204, 163, 0.15);
    }
    .connecting-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .connecting-text {
      font-size: 15px;
      color: #eee;
      line-height: 1.5;
    }
    .connecting-text-hint {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }

    .disconnected-page {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 100;
      background: #1a1a2e;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .disconnected-page.active { display: flex; }
    .disconnected-icon {
      font-size: 56px;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    .disconnected-title {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
    }
    .disconnected-desc {
      font-size: 14px;
      color: #aaa;
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 4px;
    }
    .disconnected-hint {
      font-size: 12px;
      color: #666;
      margin-top: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #0f3460;
      border-top-color: #4ecca3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #input-panel { display: none !important; }
    body.input-mode #input-panel { display: flex !important; }
    body.input-mode #touchpad { display: none !important; }
    #touchpad { display: none; flex: 1 1 auto; min-height: 80px; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); border-top: 2px solid #4ecca3; position: relative; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; flex-direction: column; align-items: center; justify-content: flex-start; gap: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
    body.mobile-mode #touchpad { display: flex !important; }
    body.mobile-mode .viewport {
      max-height: 45vh;
      flex: 0 1 auto;
    }
    .touchpad-hint {
      color: #4ecca3;
      font-size: 11px;
      opacity: 0.5;
      text-align: center;
      pointer-events: none;
    }
    .touchpad-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 10px;
      justify-content: center;
      width: 100%;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(78,204,163,0.15);
    }
    .touchpad-toolbar.collapsed {
      flex-wrap: nowrap;
      overflow: hidden;
    }
    .touchpad-toolbar.collapsed .tpk-expand {
      display: flex;
    }
    .touchpad-toolbar.collapsed .tpk-collapse {
      display: none;
    }
    .touchpad-toolbar:not(.collapsed) .tpk-expand {
      display: none;
    }
    .touchpad-toolbar:not(.collapsed) .tpk-collapse {
      display: flex;
    }
    .tpk-btn {
      width: 38px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(78,204,163,0.12);
      border: 1px solid rgba(78,204,163,0.25);
      border-radius: 6px;
      color: #4ecca3;
      font-size: 15px;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .tpk-btn:active {
      background: rgba(78,204,163,0.3);
    }
    .tpk-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #4ecca3;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tpk-toggle {
      width: 28px;
      font-size: 10px;
      color: rgba(78,204,163,0.5);
    }
    .tpk-toggle svg {
      width: 12px;
      height: 12px;
      stroke: rgba(78,204,163,0.5);
    }
    body.mobile-mode .toolbar { padding: 4px 6px; gap: 4px; }
    body.mobile-mode .status span { display: none; }
    body.mobile-mode .url-display { font-size: 12px; padding: 4px 6px; }
    body.mobile-mode .quality-badge { font-size: 9px; padding: 2px 4px; }
    body.mobile-mode .record-btn { display: none !important; }
    body.mobile-mode .mode-btn { padding: 4px 6px; font-size: 10px; min-height: 44px; min-width: 36px; flex-shrink: 0; }
    @media (max-width: 600px) {
      .toolbar { padding: 4px 6px; gap: 4px; }
      .status span { display: none; }
      .url-display { font-size: 12px; padding: 4px 6px; }
      .quality-badge { font-size: 9px; padding: 2px 4px; }
      .record-btn { display: none !important; }
      .mode-btn { padding: 4px 6px; font-size: 10px; min-height: 44px; min-width: 36px; flex-shrink: 0; }
      .mode-btn span { display: inline; }
      .viewport {
        max-height: 40vh;
        flex-shrink: 1;
      }
    }
    @media (min-width: 601px) and (max-width: 1024px) {
      .toolbar { padding: 5px 8px; gap: 6px; }
      .status span { display: none; }
      .url-display { font-size: 12px; padding: 5px 8px; }
      .quality-badge { font-size: 10px; padding: 3px 6px; }
      .record-btn { display: none !important; }
      .mode-btn { padding: 5px 8px; font-size: 11px; min-height: 44px; min-width: 40px; flex-shrink: 0; }
      .mode-btn span { display: inline; }
      .viewport {
        max-height: 45vh;
        flex-shrink: 1;
      }
    }
    @media (max-width: 400px) {
      .toolbar { padding: 3px 4px; gap: 3px; }
      .quality-badge { display: none; }
    }
    @media (hover: none) {
      .record-btn { min-height: 44px; }
      .mode-btn { min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="disconnected-page" id="disconnectedPage">
    <div class="disconnected-icon" id="disconnectedIcon">&#x1F4CF;&#xFE0F;</div>
    <div class="disconnected-title" id="disconnectedTitle">Disconnected</div>
    <div class="disconnected-desc" id="disconnectedDesc">The browser session has ended.</div>
    <div class="disconnected-hint" id="disconnectedHint">Please start a new browser session to continue.</div>
  </div>

  <div class="toolbar">
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
    <input type="text" class="url-display" id="urlDisplay" readonly placeholder="No page loaded">
    <div class="quality-badge" id="qualityBadge">--</div>
    <button class="mode-btn" id="modeBtn" title="Switch interaction mode">
      <span id="modeText">Desktop</span>
    </button>
    <button class="record-btn" id="recordBtn" title="Toggle Recording">
      <div class="record-dot"></div>
      <span id="recordText">Record</span>
    </button>
  </div>
  
  <div class="view-tabs" id="viewTabs"></div>
  <div class="view-tip" id="viewTip"></div>

  <div class="viewport">
    <div class="connecting" id="connecting">
      <div class="connecting-card">
        <div class="connecting-icon" id="connectingIcon">&#x1F4CF;&#xFE0F;</div>
        <div class="spinner" id="connectingSpinner" style="display:none;"></div>
        <div class="connecting-text" id="connectingText">Connecting to browser...</div>
        <div class="connecting-text-hint" id="connectingHint"></div>
      </div>
    </div>
    <div class="screen-container" id="screenContainer">
      <img id="screen" style="display: none;" draggable="false">
      <div id="cursor"></div>
    </div>
  </div>

  <div id="input-panel" style="position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:6px 12px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,0.95);border-top:1px solid #eee;box-sizing:border-box;flex-direction:column;">
    <div id="input-target" style="color:#999;font-size:11px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">target: --</div>
    <div style="display:flex;gap:8px;align-items:center;width:100%;">
      <input id="input-field" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="..."
        style="flex:1;min-width:0;height:36px;border:1px solid #dcdcdc;border-radius:18px;padding:0 14px;font-size:16px;outline:none;background:#fff;color:#333;" />
      <button id="input-send" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#4285F4;color:#fff;border:none;border-radius:50%;cursor:pointer;padding:0;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
  
  <div id="touchpad">
    <div class="touchpad-toolbar collapsed" id="touchpadToolbar">
      <button class="tpk-btn tpk-key" data-key="Tab" data-code="Tab" title="Tab">
        <svg viewBox="0 0 24 24"><path d="M3 21V3h2v18H3z M21 12H7l4-4M7 12l4 4"/></svg>
      </button>
      <button class="tpk-btn tpk-key" data-key="ArrowLeft" data-code="ArrowLeft" title="Left">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="tpk-btn tpk-key" data-key="ArrowDown" data-code="ArrowDown" title="Down">
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button class="tpk-btn tpk-key" data-key="ArrowUp" data-code="ArrowUp" title="Up">
        <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button class="tpk-btn tpk-key" data-key="ArrowRight" data-code="ArrowRight" title="Right">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="tpk-btn tpk-key" data-key="Enter" data-code="Enter" title="Enter">
        <svg viewBox="0 0 24 24"><path d="M7 13l5 5 5-5M12 18V6"/><line x1="5" y1="21" x2="19" y2="21"/></svg>
      </button>
      <button class="tpk-btn tpk-key" data-key="Backspace" data-code="Backspace" title="Backspace">
        <svg viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
      </button>
      <button class="tpk-btn tpk-key" data-key="Escape" data-code="Escape" title="Esc">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <button class="tpk-btn tpk-toggle tpk-expand" id="tpkExpand" title="More">
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button class="tpk-btn tpk-toggle tpk-collapse" id="tpkCollapse" title="Less">
        <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
    </div>
    <div class="touchpad-body">
      <div class="touchpad-hint" id="touchpadHint">Touchpad: move / long-press drag / two-finger scroll</div>
      <div id="modeBadge" style="display:none;color:#fff;font-size:12px;padding:3px 10px;border-radius:4px;pointer-events:none;font-weight:bold;"></div>
    </div>
  </div>

  <script>

    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const defaultPort = 5005;
    const port = parseInt(location.port, 10) || defaultPort;
    const urlParams = new URLSearchParams(location.search);
    const instanceId = urlParams.get('instanceId');
    const session = urlParams.get('session') || 'default';
    const rawSelector = urlParams.get('selector');
    const selector = rawSelector ? decodeURIComponent(rawSelector) : undefined;
    const wsParam = instanceId ? 'instanceId=' + instanceId : 'session=' + session;

    const wsUrl = wsProtocol + '//' + location.hostname + ':' + port + '?' + wsParam + (selector ? '&selector=' + encodeURIComponent(selector) : '');

    // Background management
    let shouldReconnect = true;
    let reconnectTimer = null;
    let backgroundTimer = null;
    let reconnectAttempts = 0;
    let everConnected = false;
    const BACKGROUND_TIMEOUT = 60000; // 60 seconds
    
    const screen = document.getElementById('screen');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const urlDisplay = document.getElementById('urlDisplay');
    const qualityBadge = document.getElementById('qualityBadge');
    const connecting = document.getElementById('connecting');
    const disconnectedPage = document.getElementById('disconnectedPage');
    const disconnectedIcon = document.getElementById('disconnectedIcon');
    const disconnectedTitle = document.getElementById('disconnectedTitle');
    const disconnectedDesc = document.getElementById('disconnectedDesc');
    const disconnectedHint = document.getElementById('disconnectedHint');

    const ua = (navigator.userAgent || '').toLowerCase();

    function detectDeviceMode() {
      var uaMatch = /iphone|ipod|android(?=.*mobile)|mobile|tablet|ipad/i.test(ua);
      return uaMatch ? 'mobile' : 'desktop';
    }

    var _deviceCurrent = detectDeviceMode();

    const DeviceMode = {
      _current: _deviceCurrent,
      _listeners: [],
      _manualOverride: null,
      get current() { return this._current; },
      onModeChange: function(fn) { this._listeners.push(fn); },
      setManual: function(mode) {
        this._manualOverride = mode;
        this.switchTo(mode);
      },
      clearManual: function() {
        this._manualOverride = null;
      },
      switchTo: function(mode) {
        if (mode === this._current) return;
        var prev = this._current;
        this._current = mode;
        if (mode === 'desktop') {
          MobileModule.detach();
          DesktopModule.attach();
        } else {
          DesktopModule.detach();
          MobileModule.attach();
        }
        this._listeners.forEach(function(fn) { fn(mode, prev); });
      },
      autoDetectAndSwitch: function() {
        if (this._manualOverride !== null) return;
        var newMode = detectDeviceMode();
        if (newMode !== this._current) this.switchTo(newMode);
      }
    };

    const modeBtn = document.getElementById('modeBtn');
    const modeText = document.getElementById('modeText');

    function updateModeButton() {
      if (!modeText) return;
      var mode = DeviceMode.current;
      modeText.textContent = mode === 'desktop' ? '🖥️ Desktop' : '📱 Mobile';
      if (modeBtn) {
        modeBtn.title = 'Switch to ' + (mode === 'desktop' ? 'Mobile' : 'Desktop') + ' mode';
      }
    }

    if (modeBtn) {
      modeBtn.addEventListener('click', function() {
        var newMode = DeviceMode.current === 'desktop' ? 'mobile' : 'desktop';
        DeviceMode.setManual(newMode);
      });
    }

    DeviceMode.onModeChange(function(mode) {
      updateModeButton();
    });

    updateModeButton();

    var hiddenInput = null;
    let cursorInitialized = false;

    const DesktopModule = {
      attach: function() {
        if (hiddenInput && hiddenInput.parentNode) return;
        hiddenInput = document.createElement('input');
        hiddenInput.type = 'text';
        hiddenInput.style.cssText = 'position:fixed;right:8px;bottom:80px;opacity:0.01;width:1px;height:1px;border:none;outline:none;padding:0;margin:0;font-size:16px;pointer-events:none;';
        hiddenInput.id = 'hidden-input';
        hiddenInput.setAttribute('autocomplete', 'off');
        hiddenInput.setAttribute('autocorrect', 'off');
        hiddenInput.setAttribute('autocapitalize', 'off');
        hiddenInput.setAttribute('spellcheck', 'false');
        document.body.appendChild(hiddenInput);

        hiddenInput.addEventListener('compositionstart', () => {
          isComposing = true;
          lastInputValue = hiddenInput.value;
          console.log('[Viewer] compositionstart, lastInputValue:', lastInputValue);
        });

        hiddenInput.addEventListener('compositionend', (e) => {
          isComposing = false;
          const newText = hiddenInput.value.slice(lastInputValue.length);
          console.log('[Viewer] compositionend, newText:', newText, 'hiddenInput.value:', hiddenInput.value);
          if (newText) {
            sendUserActivity();
            safeSend(JSON.stringify({
              type: 'keyboard_insert_text',
              text: newText
            }));
          }
          lastInputValue = '';
          hiddenInput.value = '';
        });

        hiddenInput.addEventListener('input', (e) => {
          console.log('[Viewer] input event, isComposing:', isComposing, 'hiddenInput.value:', hiddenInput.value);
          if (isComposing) return;

          const newValue = hiddenInput.value;
          if (newValue.length > 0) {
            sendUserActivity();
            safeSend(JSON.stringify({
              type: 'keyboard_insert_text',
              text: newValue
            }));
          }
          hiddenInput.value = '';
          lastInputValue = '';
        });

        hiddenInput.addEventListener('paste', (e) => {
          e.preventDefault();
          e.stopPropagation();

          const text = e.clipboardData.getData('text');
          console.log('[Viewer] paste event, text:', text);
          if (text) {
            sendUserActivity();
            safeSend(JSON.stringify({
              type: 'keyboard_insert_text',
              text: text
            }));
          }
        });

        focusHiddenInput();
      },
      detach: function() {
        if (hiddenInput) { hiddenInput.blur(); if (hiddenInput.parentNode) hiddenInput.parentNode.removeChild(hiddenInput); hiddenInput = null; }
      }
    };

    const MobileModule = {
      attach: function() {
        document.body.classList.add('mobile-mode');
        if (touchpad) { touchpad.style.position = 'relative'; touchpad.style.zIndex = '10'; }
        setupToolbar();
        cursorInitialized = false;
        setTimeout(initCursor, 100);
      },
      detach: function() {
        document.body.classList.remove('mobile-mode');
        var ip = document.getElementById('input-panel');
        if (ip) { ip.style.display = 'none'; ip.style.bottom = '0px'; }
        if (touchpad) { touchpad.style.display = ''; }
        if (cursor) cursor.style.display = 'block';
      }
    };

    const degradedToast = document.createElement('div');
    degradedToast.id = 'degraded-toast';
    degradedToast.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,200,0,0.9);color:#000;padding:10px 20px;border-radius:4px;font-family:sans-serif;font-size:14px;z-index:9999;display:none;pointer-events:none;';
    degradedToast.textContent = 'Element not found, showing full page';
    document.body.appendChild(degradedToast);

    let ws = null;
    let metadata = { deviceWidth: 1280, deviceHeight: 720, pageScaleFactor: 1, format: 'jpeg' };
    let userActivityTimeout = null;
    let pendingBinary = false;
    let modifiers = 0;
    let clickCount = 0;
    let clickTimer = null;
    let isComposing = false;
    let lastInputValue = '';
    let fixedSize = false;
    let isRecording = false;
    var _inputPollRaf = null;

    var detectedViews = [];
    var activeViewId = 'main';
    var viewSwitching = false;
    var viewSwitchId = 0;
    var originalViewport = null;
    var viewportLocked = false;
    var fullPageSnapshot = null;

    function connect() {
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        statusDot.classList.add('connected');
        statusText.textContent = 'Connected';
        connecting.style.display = 'none';
        hideDisconnectedPage();
        reconnectTimer = null;
        reconnectAttempts = 0;
        everConnected = true;
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Disconnected';
        reconnectAttempts++;

        if (!everConnected) {
          var iconEl = document.getElementById('connectingIcon');
          var spinnerEl = document.getElementById('connectingSpinner');
          var textEl = document.getElementById('connectingText');
          if (iconEl) iconEl.style.display = 'none';
          if (spinnerEl) spinnerEl.style.display = '';
          if (textEl) textEl.textContent = 'Connecting to browser...';
          connecting.style.display = 'flex';
        } else if (reconnectAttempts > 3) {
          showDisconnectedPage(
            'Session Closed',
            'The browser session has ended or was killed.',
            'Please start a new browser session to continue.',
            '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
          );
        } else {
          showDisconnectedPage(
            'Disconnected',
            'Connection to the browser was lost.',
            'Reconnecting (' + reconnectAttempts + ')...',
            '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1112.73 12.73"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="12" y1="21" x2="12" y2="23"/></svg>'
          );
        }

        if (shouldReconnect && reconnectAttempts <= 10) {
          reconnectTimer = setTimeout(connect, 2000);
        }

        if (originalViewport) {
          metadata.deviceWidth = originalViewport.width;
          metadata.deviceHeight = originalViewport.height;
          originalViewport = null;
        }
        viewportLocked = false;
        viewSwitching = false;
        activeViewId = 'main';
      };
      
      ws.onerror = () => {
        statusText.textContent = 'Connection error';
      };
      
      ws.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
          handleBinary(event.data);
          return;
        }

        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (_e) {
          return;
        }

        // Handle recorder responses
        if (msg.id && msg.id.startsWith('recorder-')) {
          if (msg.id.startsWith('recorder-start-') && msg.success) {
            isRecording = true;
            recordBtn.classList.add('recording');
            recordText.textContent = 'Stop';
          } else if (msg.id.startsWith('recorder-stop-') && msg.success) {
            isRecording = false;
            recordBtn.classList.remove('recording');
            recordText.textContent = 'Record';

            // Download YAML
            if (msg.data && msg.data.yaml) {
              const blob = new Blob([msg.data.yaml], { type: 'text/yaml' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'session-' + Date.now() + '.yaml';
              a.click();
              URL.revokeObjectURL(url);
              alert('Recording stopped. ' + msg.data.steps + ' steps recorded.');
            }
          }
          return;
        }

        switch (msg.type) {
          case 'frame':
            pendingBinary = true;
            if (!viewportLocked && !viewSwitching && msg.metadata) {
              const prevElement = metadata.element;
              metadata = msg.metadata;
              if (prevElement && !metadata.element) {
                metadata.element = prevElement;
              }
              if (metadata.element) {
                metadata.deviceWidth = metadata.element.width;
                metadata.deviceHeight = metadata.element.height;
              }
              viewportLocked = true;
            }
            if (msg.format) metadata.format = msg.format;
            if (msg.state) {
              qualityBadge.textContent = msg.state;
            }
            break;

          case 'status':
            if (msg.connected === false) {
              statusDot.classList.remove('connected');
              statusText.textContent = 'Instance not found';
              const p = connecting.querySelector('p');
              if (p) p.textContent = 'The browser instance has been closed or not found.';
              connecting.style.display = 'flex';
            } else {
              if (msg.url) {
                urlDisplay.value = msg.url;
              }
              if (msg.title) {
                document.title = msg.title + ' - Agent Browser Viewer';
              }
              if (msg.viewportWidth) {
                if (viewSwitching) {
                  if (msg.switchId === undefined || msg.switchId === viewSwitchId) {
                    metadata.deviceWidth = msg.viewportWidth;
                    metadata.deviceHeight = msg.viewportHeight;
                    viewportLocked = true;
                    viewSwitching = false;
                    if (activeViewId === 'main') {
                      originalViewport = null;
                    }
                  }
                } else {
                  if (!viewportLocked) {
                    metadata.deviceWidth = msg.viewportWidth;
                    metadata.deviceHeight = msg.viewportHeight;
                    viewportLocked = true;
                  }
                }
              }
              if (msg.element) {
                metadata.element = msg.element;
              } else {
                metadata.element = undefined;
                if (selector && msg.degraded) {
                  showDegradedMessage();
                }
              }
              if (screen.src && metadata.deviceWidth && metadata.deviceHeight) {
                fitImageToContainer();
              }
            }
            break;

          case 'navigation':
            urlDisplay.value = msg.data.url;
            document.title = msg.data.title + ' - Agent Browser Viewer';
            break;

          case 'input_focused':
            if (inputMode) return;
            var sel = msg.selector || (msg.id ? '#' + msg.id : '');
            enterInputMode(msg.value || '', msg.inputType || msg.tag || '', msg.placeholder || '', sel, msg.rect);
            break;

          case 'input_value':
            if (!inputMode) {
              var field = document.getElementById('input-field');
              if (field && typeof msg.text === 'string') {
                field.value = msg.text;
              }
            }
            break;

          case 'input_blur':
            exitInputMode();
            break;

          case 'views_update':
            updateViewTabs(msg.views || []);
            break;

          default:
        }
      };
    }
    
    function handleBinary(data) {
      if (!pendingBinary) return;
      pendingBinary = false;

      const blob = new Blob([data], {
        type: metadata.format === 'webp' ? 'image/webp' : 'image/jpeg'
      });
      const url = URL.createObjectURL(blob);

      const cleanup = () => {
        URL.revokeObjectURL(url);
        connecting.style.display = 'none';
        screen.style.display = 'block';
        fitImageToContainer();
        if (!cursorInitialized && DeviceMode.current === 'mobile') {
          cursorInitialized = true;
          setTimeout(initCursor, 50);
        }
      };

      screen.onload = cleanup;
      screen.onerror = cleanup;
      screen.src = url;
    }

    function fitImageToContainer() {
      if (!metadata.deviceWidth || !metadata.deviceHeight) return;
      var vp = document.querySelector('.viewport');
      var container = vp || screen.parentElement;
      if (!container) return;
      var cw = container.clientWidth;
      var ch = container.clientHeight;
      if (cw <= 0 || ch <= 0) return;

      var imgW = metadata.deviceWidth;
      var imgH = metadata.deviceHeight;
      var imgRatio = imgW / imgH;
      var contRatio = cw / ch;

      var dw, dh;
      if (imgRatio > contRatio) {
        dw = cw;
        dh = cw / imgRatio;
      } else {
        dh = ch;
        dw = ch * imgRatio;
      }

      screen.style.width = Math.round(dw) + 'px';
      screen.style.height = Math.round(dh) + 'px';

    }
    
    function safeSend(data) {
      if (ws && ws.readyState === 1) {
        ws.send(data);
      }
    }
    
    function sendUserActivity() {
      safeSend(JSON.stringify({ type: 'user_activity' }));
      
      clearTimeout(userActivityTimeout);
      userActivityTimeout = setTimeout(() => {
        qualityBadge.textContent = 'static';
      }, 2000);
      
      qualityBadge.textContent = 'interacting';
    }
    
    function screenToPage(screenX, screenY) {
      const rect = screen.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return { x: 0, y: 0 };

      var scaleX = metadata.deviceWidth / rect.width;
      var scaleY = metadata.deviceHeight / rect.height;
      var pageX = Math.round((screenX - rect.left) * scaleX);
      var pageY = Math.round((screenY - rect.top) * scaleY);

      if (metadata.element) {
        pageX += metadata.element.x;
        pageY += metadata.element.y;
      }

      return { x: pageX, y: pageY };
    }
    
    function updateModifiers(e) {
      modifiers = 0;
      if (e.altKey) modifiers |= 1;
      if (e.ctrlKey) modifiers |= 2;
      if (e.metaKey) modifiers |= 4;
      if (e.shiftKey) modifiers |= 8;
    }

    function showDegradedMessage() {
      degradedToast.style.display = 'block';
      setTimeout(() => {
        degradedToast.style.display = 'none';
      }, 3000);
    }

    function focusHiddenInput() {
      hiddenInput.focus();
      hiddenInput.select();
    }
    
    screen.addEventListener('dragstart', (e) => e.preventDefault());
    
    screen.addEventListener('click', () => {
      if (DeviceMode.current === 'desktop') focusHiddenInput();
    });

    let screenTouchStartPos = null;
    let screenTouchMoved = false;
    let screenDragMode = false;
    let screenLongPressTimer = null;

    function cancelScreenLongPress() {
      if (screenLongPressTimer) {
        clearTimeout(screenLongPressTimer);
        screenLongPressTimer = null;
      }
    }

    function enterScreenDragMode() {
      screenDragMode = true;
      cancelScreenLongPress();
      updateScreenRect();
      cursor.classList.add('cursor-drag');
      var pagePos = screenToPage(cursorPos.x, cursorPos.y);
      safeSend(JSON.stringify({ type: 'input_mouse', eventType: 'mousePressed', x: pagePos.x, y: pagePos.y, button: 'left', clickCount: 1, modifiers: 0 }));
    }

    screen.addEventListener('touchstart', (e) => {
      if (DeviceMode.current !== 'mobile' && DeviceMode.current !== 'desktop') return;
      e.preventDefault();
      if (e.touches.length === 1) {
        const t = e.touches[0];
        screenTouchStartPos = { x: t.clientX, y: t.clientY };
        screenTouchMoved = false;
        screenDragMode = false;
        cancelScreenLongPress();
        updateScreenRect();
        if (!cursorInitialized && screenRect && screenRect.width > 0) {
          cursorPos = { x: screenRect.left + screenRect.width / 2, y: screenRect.top + screenRect.height / 2 };
          updateCursor();
          cursor.style.display = 'block';
          cursorInitialized = true;
        }
        screenLongPressTimer = setTimeout(function() {
          if (!screenTouchMoved && screenTouchStartPos) {
            enterScreenDragMode();
          }
        }, 400);
      } else if (e.touches.length === 2) {
        cancelScreenLongPress();
        if (screenDragMode) {
          screenDragMode = false;
          cursor.classList.remove('cursor-drag');
          updateScreenRect();
          var pagePos = screenToPage(cursorPos.x, cursorPos.y);
          safeSend(JSON.stringify({ type: 'input_mouse', eventType: 'mouseReleased', x: pagePos.x, y: pagePos.y, button: 'left', clickCount: 1, modifiers: 0 }));
        }
        screenTouchStartPos = null;
        const t0 = e.touches[0];
        const t1 = e.touches[1];
        twoFingerStartPos = {
          lastMidX: (t0.clientX + t1.clientX) / 2,
          lastMidY: (t0.clientY + t1.clientY) / 2,
        };
      }
    }, { passive: false });

    screen.addEventListener('touchmove', (e) => {
      if (DeviceMode.current !== 'mobile' && DeviceMode.current !== 'desktop') return;
      e.preventDefault();

      if (e.touches.length === 2 && twoFingerStartPos) {
        const t0 = e.touches[0];
        const t1 = e.touches[1];
        const midX = (t0.clientX + t1.clientX) / 2;
        const midY = (t0.clientY + t1.clientY) / 2;
        const rawDX = midX - twoFingerStartPos.lastMidX;
        const rawDY = midY - twoFingerStartPos.lastMidY;
        twoFingerStartPos.lastMidX = midX;
        twoFingerStartPos.lastMidY = midY;
        updateScreenRect();
        const pagePos = screenToPage(cursorPos.x, cursorPos.y);
        safeSend(JSON.stringify({
          type: 'input_mouse',
          eventType: 'mouseWheel',
          x: pagePos.x,
          y: pagePos.y,
          deltaX: rawDX * 1.5,
          deltaY: rawDY * 1.5,
          modifiers: 0
        }));
        return;
      }

      if (e.touches.length === 1 && screenTouchStartPos) {
        const t = e.touches[0];
        const dx = t.clientX - screenTouchStartPos.x;
        const dy = t.clientY - screenTouchStartPos.y;
        if (!screenTouchMoved && Math.sqrt(dx * dx + dy * dy) > 3) {
          screenTouchMoved = true;
          cancelScreenLongPress();
        }
        if (screenTouchMoved) {
          updateScreenRect();
          var accel = computeAcceleration(dx, dy);
          cursorPos.x = clampCursor(cursorPos.x + dx * accel, screenRect.left, screenRect.right);
          cursorPos.y = clampCursor(cursorPos.y + dy * accel, screenRect.top, screenRect.bottom);
          updateCursor();
          const pagePos = screenToPage(cursorPos.x, cursorPos.y);
          if (screenDragMode) {
            safeSend(JSON.stringify({
              type: 'input_mouse',
              eventType: 'mouseMoved',
              x: pagePos.x,
              y: pagePos.y,
              button: 'left',
              clickCount: 1,
              modifiers: 0
            }));
          } else {
            safeSend(JSON.stringify({
              type: 'input_mouse',
              eventType: 'mouseMoved',
              x: pagePos.x,
              y: pagePos.y,
              button: 'none',
              clickCount: 1,
              modifiers: 0
            }));
          }
          screenTouchStartPos = { x: t.clientX, y: t.clientY };
        }
      }
    }, { passive: false });

    screen.addEventListener('touchend', (e) => {
      if (DeviceMode.current !== 'mobile' && DeviceMode.current !== 'desktop') return;
      e.preventDefault();
      cancelScreenLongPress();
      if (e.touches.length === 0) {
        if (screenDragMode) {
          updateScreenRect();
          var pagePos = screenToPage(cursorPos.x, cursorPos.y);
          safeSend(JSON.stringify({ type: 'input_mouse', eventType: 'mouseReleased', x: pagePos.x, y: pagePos.y, button: 'left', clickCount: 1, modifiers: 0 }));
          screenDragMode = false;
          cursor.classList.remove('cursor-drag');
        } else if (!screenTouchMoved) {
          updateScreenRect();
          var tapPos = screenToPage(cursorPos.x, cursorPos.y);
          safeSend(JSON.stringify({ type: 'input_mouse', eventType: 'mousePressed', x: tapPos.x, y: tapPos.y, button: 'left', clickCount: 1, modifiers: 0 }));
          safeSend(JSON.stringify({ type: 'input_mouse', eventType: 'mouseReleased', x: tapPos.x, y: tapPos.y, button: 'left', clickCount: 1, modifiers: 0 }));
        }
        screenTouchStartPos = null;
        screenTouchMoved = false;
        twoFingerStartPos = null;
      }
    }, { passive: false });

    screen.addEventListener('mousemove', (e) => {
      sendUserActivity();
      const pos = screenToPage(e.clientX, e.clientY);
      safeSend(JSON.stringify({
        type: 'input_mouse',
        eventType: 'mouseMoved',
        x: pos.x,
        y: pos.y
      }));
    });
    
    screen.addEventListener('mousedown', (e) => {
      sendUserActivity();
      updateModifiers(e);
      
      if (clickTimer) {
        clickCount++;
      } else {
        clickCount = 1;
        clickTimer = setTimeout(() => {
          clickCount = 0;
          clickTimer = null;
        }, 300);
      }
      
      const pos = screenToPage(e.clientX, e.clientY);
      const buttonMap = { 0: 'left', 1: 'middle', 2: 'right' };
      safeSend(JSON.stringify({
        type: 'input_mouse',
        eventType: 'mousePressed',
        x: pos.x,
        y: pos.y,
        button: buttonMap[e.button] || 'left',
        clickCount: clickCount,
        modifiers: modifiers
      }));
    });
    
    screen.addEventListener('mouseup', (e) => {
      updateModifiers(e);
      const pos = screenToPage(e.clientX, e.clientY);
      const buttonMap = { 0: 'left', 1: 'middle', 2: 'right' };
      safeSend(JSON.stringify({
        type: 'input_mouse',
        eventType: 'mouseReleased',
        x: pos.x,
        y: pos.y,
        button: buttonMap[e.button] || 'left',
        clickCount: clickCount,
        modifiers: modifiers
      }));
    });
    
    screen.addEventListener('wheel', (e) => {
      sendUserActivity();
      updateModifiers(e);
      const pos = screenToPage(e.clientX, e.clientY);
      safeSend(JSON.stringify({
        type: 'input_mouse',
        eventType: 'mouseWheel',
        x: pos.x,
        y: pos.y,
        deltaX: e.deltaX,
        deltaY: e.deltaY,
        modifiers: modifiers
      }));
      e.preventDefault();
    });
    
    document.addEventListener('keydown', (e) => {
      console.log('[Viewer] keydown, key:', e.key, 'target:', e.target === hiddenInput ? 'hiddenInput' : 'other', 'metaKey:', e.metaKey, 'ctrlKey:', e.ctrlKey);
      if (e.target === hiddenInput) {
        if (e.key === 'Tab') {
          e.preventDefault();
        }
        
        if (e.key === 'Backspace' || e.key === 'Delete') {
          e.preventDefault();
          sendUserActivity();
          safeSend(JSON.stringify({
            type: 'keyboard_down',
            key: e.key
          }));
          return;
        }
        
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && !isComposing) {
          console.log('[Viewer] single char in hiddenInput, waiting for input event');
          return;
        }
      }

      const mobileInputField = document.getElementById('input-field');
      if (mobileInputField && e.target === mobileInputField) return;

      if (isComposing) return;
      
      sendUserActivity();
      
      safeSend(JSON.stringify({
        type: 'keyboard_down',
        key: e.key
      }));
      
      if (e.key === 'Tab' || (e.key === 'Backspace' && !e.target.matches('input, textarea'))) {
        e.preventDefault();
      }
    });
    
    document.addEventListener('keyup', (e) => {
      console.log('[Viewer] keyup, key:', e.key);
      if (isComposing && e.target === hiddenInput) return;
      const mobileInputField = document.getElementById('input-field');
      if (mobileInputField && e.target === mobileInputField) return;
      
      safeSend(JSON.stringify({
        type: 'keyboard_up',
        key: e.key
      }));
    });
    
    const cursor = document.getElementById('cursor');
    const touchpad = document.getElementById('touchpad');
    const screenContainer = document.getElementById('screenContainer');

    // Initialize modules based on detected mode
    if (DeviceMode.current === 'desktop') {
      DesktopModule.attach();
    } else {
      MobileModule.attach();
    }

    let cursorPos = { x: 0, y: 0 };
    let dragMode = false;
    let isMouseDown = false;
    let lastTouchPos = null;
    let touchMoved = false;
    let twoFingerStartPos = null;
    let longPressTimer = null;
    let longPressHintTimer = null;

    const CURSOR_SENSITIVITY = 1.5;
    const WHEEL_SENSITIVITY = 2.0;
    const LONG_PRESS_MS = 800;
    const COOLDOWN_MS = 200;
    const MOVE_THRESHOLD = 5;
    const ACCELERATION = 0.8;
    const ACCEL_MAX_VELOCITY = 3.0;

    let lastMoveTime = 0;

    function computeAcceleration(dx, dy) {
      const now = Date.now();
      const dt = now - lastMoveTime;
      lastMoveTime = now;
      if (dt <= 0 || dt > 200) return CURSOR_SENSITIVITY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const velocity = Math.min(dist / dt, ACCEL_MAX_VELOCITY);
      return CURSOR_SENSITIVITY * (1 + ACCELERATION * velocity);
    }

    function computeWheelAccel(dx, dy) {
      const now = Date.now();
      const dt = now - lastMoveTime;
      lastMoveTime = now;
      if (dt <= 0 || dt > 200) return WHEEL_SENSITIVITY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const velocity = Math.min(dist / dt, ACCEL_MAX_VELOCITY);
      return WHEEL_SENSITIVITY * (1 + ACCELERATION * velocity);
    }

    let screenRect = null;

    function enterInputMode(initialValue, inputType, placeholder, selector, rect) {
      if (inputMode) return;
      inputMode = true;

      if (DeviceMode.current === 'desktop') {
        inputMode = false;
        return;
      }

      cursor.style.display = 'none';

      document.body.classList.add('input-mode');

      var labelParts = [];
      if (inputType) labelParts.push(inputType);
      if (placeholder && placeholder !== initialValue) labelParts.push(placeholder);
      var targetEl = document.getElementById('input-target');
      if (targetEl) targetEl.textContent = labelParts.length > 0 ? labelParts.join(' | ') : 'input';

      window._currentTargetSelector = selector || '';

      var field = document.getElementById('input-field');
      if (field) {
        field.value = initialValue || '';
        field.dataset.lastSent = initialValue || '';
      }

      var ip = document.getElementById('input-panel');

      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;

      document.body.style.touchAction = 'none';
      document.documentElement.style.touchAction = 'none';

      setTimeout(function() {
        if (!field) return;

        // Mobile: handle virtual keyboard, scroll guards, IME polling
        var origVh = window.visualViewport ? window.visualViewport.height : window.innerHeight;

        // Register visualViewport listener for keyboard detection
        if (window.visualViewport) {
          var kbTolerance = Math.floor(window.innerHeight * 0.1);

          keyboardVvHandler = function() {
            if (!inputMode || !ip) return;
            var currentH = window.visualViewport.height;
            var kbHeight = Math.max(0, origVh - currentH);
            // Fallback: use innerHeight difference
            if (kbHeight < kbTolerance) {
              kbHeight = Math.max(kbHeight, Math.max(0, window.innerHeight - currentH));
            }
            if (kbHeight > kbTolerance) {
              ip.style.bottom = kbHeight + 'px';
            } else {
              ip.style.bottom = '0px';
            }
          };
          window.visualViewport.addEventListener('resize', keyboardVvHandler);
        }

        field.focus();

        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;

        // Delayed check: wait for keyboard animation to complete (~300ms)
        setTimeout(function() {
          if (keyboardVvHandler) keyboardVvHandler();
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
          document.documentElement.scrollTop = 0;
        }, 350);

        // Scroll guard interval: continuously fight iOS auto-scroll (reference demo)
        if (!_scrollGuard) {
          _scrollGuard = setInterval(function() {
            if (!inputMode) return;
            if (window.scrollY > 0 || document.body.scrollTop > 0 ||
                document.documentElement.scrollTop > 0) {
              window.scrollTo(0, 0);
              document.body.scrollTop = 0;
              document.documentElement.scrollTop = 0;
            }
          }, 100);
        }

        // RAF poll: reliable value-change detection for IME/CJK/clipboard/paste
        var _pollField = field;
        var _lastPolled = _pollField.value || '';
        window._fieldComposing = false;

        _pollField.addEventListener('compositionstart', function() {
          window._fieldComposing = true;
        });
        _pollField.addEventListener('compositionend', function() {
          window._fieldComposing = false;
          // Double-RAF: yields current frame + next paint cycle.
          // On mobile browsers (iOS Safari, Android WebView), .value may
          // not be updated until 1-2 frames after compositionend fires.
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              syncInputToRemote(_pollField);
            });
          });
        });

        (function startPoll() {
          function poll() {
            if (!inputMode || !_pollField) { _inputPollRaf = null; return; }
            var cur = _pollField.value;
            if (cur !== _lastPolled) {
              _lastPolled = cur;
              if (!window._fieldComposing) {
                syncInputToRemote(_pollField);
              }
            }
            _inputPollRaf = requestAnimationFrame(poll);
          }
          _inputPollRaf = requestAnimationFrame(poll);
        })();
      }, 100);
    }

    function exitInputMode() {
      if (!inputMode) return;
      inputMode = false;

      if (_inputPollRaf) { cancelAnimationFrame(_inputPollRaf); _inputPollRaf = null; }
      window._fieldComposing = false;

      cursor.style.display = 'block';

      const field = document.getElementById('input-field');
      if (field) { field.value = ''; field.blur(); delete field.dataset.lastSent; }

      document.body.classList.remove('input-mode');

      // Reset PC floating panel styles
      var ip = document.getElementById('input-panel');
      if (ip) {
        ip.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:6px 12px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,0.95);border-top:1px solid #eee;box-sizing:border-box;flex-direction:column;';
      }

      // Cleanup visualViewport handler
      if (keyboardVvHandler && window.visualViewport) {
        window.visualViewport.removeEventListener('resize', keyboardVvHandler);
        keyboardVvHandler = null;
      }

      // Cleanup scroll guard
      if (_scrollGuard) {
        clearInterval(_scrollGuard);
        _scrollGuard = null;
      }

      // Restore touch action
      document.body.style.touchAction = '';
      document.documentElement.style.touchAction = '';

      safeSend(JSON.stringify({
        type: 'input_blur_element',
        selector: window._currentTargetSelector || ''
      }));
    }

    function updateViewTabs(views) {
      detectedViews = views || [];
      if (activeViewId !== 'main' && !detectedViews.some(function(v) { return v.id === activeViewId; })) {
        selectView('main');
      }
      renderViewTabs();
    }

    function renderViewTabs() {
      var viewTabsEl = document.getElementById('viewTabs');
      if (!viewTabsEl) return;
      var viewTipEl = document.getElementById('viewTip');

      if (detectedViews.length === 0) {
        viewTabsEl.classList.remove('visible');
        viewTabsEl.innerHTML = '';
        if (viewTipEl) { viewTipEl.classList.remove('visible'); }
        return;
      }

      viewTabsEl.classList.add('visible');

      if (viewTipEl) {
        var types = {};
        for (var t = 0; t < detectedViews.length; t++) { types[detectedViews[t].type || 'container'] = true; }
        var tipText = '';
        if (types['captcha']) {
          tipText = '检测到验证码，点击标签切换到验证码视图可在线操作';
        } else if (types['form']) {
          tipText = '检测到表单，点击标签切换到表单视图可在线填写';
        } else if (types['dialog']) {
          tipText = '检测到弹窗，点击标签切换到弹窗视图可在线交互';
        } else {
          tipText = '点击标签可切换到对应区域进行操作';
        }
        viewTipEl.textContent = tipText;
        viewTipEl.classList.add('visible');
      }

      var typeIcons = {
        captcha: '✅',
        form: '✍',
        dialog: '❖',
        nav: '☰',
        sidebar: '◤',
        iframe: '⧉',
        container: '▦',
      };

      var html = '<button class="view-tab' + (activeViewId === 'main' ? ' active' : '') +
        '" data-vid="main"><span>主页面</span></button>';

      for (var i = 0; i < detectedViews.length; i++) {
        var v = detectedViews[i];
        var label = v.label || v.id;
        var icon = typeIcons[v.type] || typeIcons.container;
        html += '<button class="view-tab' + (activeViewId === v.id ? ' active' : '') +
          '" data-vid="' + v.id +
          '" title="' + label + ' ' + v.rect.width + 'x' + v.rect.height +
          '"><img id="vt-img-' + v.id + '" /><span>' + icon + ' ' + label + '</span></button>';
      }

      viewTabsEl.innerHTML = html;

      var btns = viewTabsEl.querySelectorAll('.view-tab');
      for (var j = 0; j < btns.length; j++) {
        btns[j].addEventListener('click', function(e) {
          var t = (e.target).closest('.view-tab') || e.target;
          selectView(t.getAttribute('data-vid') || 'main');
        });
      }

      generateThumbnails();
    }

    function selectView(vid) {
      viewSwitching = true;
      viewSwitchId++;
      var mySwitchId = viewSwitchId;
      activeViewId = vid;

      if (vid === 'main') {
        safeSend(JSON.stringify({ type: 'select_view', rect: null, switchId: mySwitchId }));
        metadata.element = undefined;
        if (originalViewport) {
          metadata.deviceWidth = originalViewport.width;
          metadata.deviceHeight = originalViewport.height;
        }
        viewportLocked = true;
      } else {
        var v = detectedViews.find(function(x) { return x.id === vid; });
        if (v) {
          if (!originalViewport) {
            originalViewport = { width: metadata.deviceWidth, height: metadata.deviceHeight };
          }
          safeSend(JSON.stringify({ type: 'select_view', viewId: vid, rect: v.rect, switchId: mySwitchId }));
          metadata.deviceWidth = v.rect.width;
          metadata.deviceHeight = v.rect.height;
          metadata.element = {
            selector: vid,
            x: v.rect.x,
            y: v.rect.y,
            width: v.rect.width,
            height: v.rect.height,
          };
          viewportLocked = true;
        }
      }

      if (screen.src && metadata.deviceWidth && metadata.deviceHeight) {
        fitImageToContainer();
      }
      renderViewTabs();
    }

    function generateThumbnails() {
      var imgEl = document.getElementById('screen');
      if (!imgEl || !imgEl.naturalWidth) return;

      var fullVP = originalViewport || { width: metadata.deviceWidth, height: metadata.deviceHeight };
      var scaleW = imgEl.naturalWidth / fullVP.width;
      var scaleH = imgEl.naturalHeight / fullVP.height;

      for (var i = 0; i < detectedViews.length; i++) {
        var v = detectedViews[i];
        var thumb = document.getElementById('vt-img-' + v.id);
        if (!thumb) continue;

        try {
          var sx = Math.round(v.rect.x * scaleW);
          var sy = Math.round(v.rect.y * scaleH);
          var sw = Math.max(1, Math.min(Math.round(v.rect.width * scaleW), imgEl.naturalWidth - sx));
          var sh = Math.max(1, Math.min(Math.round(v.rect.height * scaleH), imgEl.naturalHeight - sy));

          var tc = document.createElement('canvas');
          tc.width = 36;
          tc.height = 22;
          var tctx = tc.getContext('2d');
          if (tctx) {
            tctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, 36, 22);
            thumb.src = tc.toDataURL('image/jpeg', 0.5);
          }
        } catch { /* bounds error */ }
      }
    }

    var _syncDebounceTimer = null;
    function syncInputToRemote(field) {
      if (!field || !inputMode) return;
      var current = field.value;
      var lastSent = field.dataset.lastSent || '';
      if (current === lastSent) return;

      var isFirstSync = !field.dataset.lastSent;
      function doSend() {
        safeSend(JSON.stringify({
          type: 'input_fill',
          text: current,
          selector: window._currentTargetSelector || ''
        }));
        field.dataset.lastSent = current;
      }

      if (isFirstSync) {
        doSend();
      } else {
        clearTimeout(_syncDebounceTimer);
        _syncDebounceTimer = setTimeout(doSend, 30);
      }
    }

    function sendInputText() {
      const field = document.getElementById('input-field');
      if (!field || !field.value.trim()) return;
      
      var finalText = field.value;
      var sel = window._currentTargetSelector || '';
      
      // Send final text via input_fill + Enter key
      safeSend(JSON.stringify({
        type: 'input_fill',
        text: finalText,
        selector: sel
      }));
      safeSend(JSON.stringify({
        type: 'input_keyboard',
        eventType: 'keyDown',
        key: 'Enter',
        code: 'Enter',
        modifiers: 0,
        selector: sel
      }));
      safeSend(JSON.stringify({
        type: 'input_keyboard',
        eventType: 'keyUp',
        key: 'Enter',
        code: 'Enter',
        modifiers: 0,
        selector: sel
      }));
      
      field.value = '';
      exitInputMode();
    }

    function startMomentum() {
      momentumActive = true;
      var frame = function() {
        if (!momentumActive) return;
        lastWheelDeltaX *= 0.92;
        lastWheelDeltaY *= 0.92;
        if (Math.abs(lastWheelDeltaX) < 0.5 && Math.abs(lastWheelDeltaY) < 0.5) {
          momentumActive = false;
          return;
        }
        var pagePos = screenToPage(cursorPos.x, cursorPos.y);
        safeSend(JSON.stringify({
          type: 'input_mouse',
          eventType: 'mouseWheel',
          x: pagePos.x,
          y: pagePos.y,
          deltaX: lastWheelDeltaX,
          deltaY: lastWheelDeltaY,
          modifiers: 0
        }));
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    }

    function initCursor() {
      updateScreenRect();
      if (!screenRect || screenRect.width <= 0 || screenRect.height <= 0) {
        setTimeout(initCursor, 100);
        return;
      }
      cursorPos = { x: screenRect.left + screenRect.width / 2, y: screenRect.top + screenRect.height / 2 };
      updateCursor();
      cursor.style.display = 'block';
      cursorInitialized = true;
    }

    function updateCursor() {
      cursor.style.left = cursorPos.x + 'px';
      cursor.style.top = cursorPos.y + 'px';
    }

    function clampCursor(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function setCursorMode(mode) {
      cursor.className = '';
      if (mode === 'move') cursor.classList.add('cursor-move');
      else if (mode === 'drag') cursor.classList.add('cursor-drag');
      else if (mode === 'longpress') cursor.classList.add('cursor-longpress');
    }

    function showModeBadge(text, color) {
      var badge = document.getElementById('modeBadge');
      if (!badge) return;
      badge.textContent = text;
      badge.style.background = color;
      badge.style.display = 'block';
    }

    function hideModeBadge() {
      var badge = document.getElementById('modeBadge');
      if (!badge) return;
      badge.style.display = 'none';
    }

    // Touchpad toolbar setup (always available when mobile module is active)
    var _toolbarSetupDone = false;
    function setupToolbar() {
      if (_toolbarSetupDone) return;
      _toolbarSetupDone = true;
      var toolbar = document.getElementById('touchpadToolbar');
      if (toolbar) {
        toolbar.addEventListener('click', function(e) {
          var btn = e.target.closest ? e.target.closest('.tpk-key') : null;
          if (!btn) return;
          e.preventDefault();
          e.stopPropagation();
          sendUserActivity();
          var key = btn.dataset.key || '';
          var code = btn.dataset.code || '';
          safeSend(JSON.stringify({ type: 'input_keyboard', eventType: 'keyDown', key: key, code: code, modifiers: 0 }));
          safeSend(JSON.stringify({ type: 'input_keyboard', eventType: 'keyUp', key: key, code: code, modifiers: 0 }));
        });

        var expandBtn = document.getElementById('tpkExpand');
        var collapseBtn = document.getElementById('tpkCollapse');
        if (expandBtn) expandBtn.addEventListener('click', function(e) { e.stopPropagation(); toolbar.classList.remove('collapsed'); });
        if (collapseBtn) collapseBtn.addEventListener('click', function(e) { e.stopPropagation(); toolbar.classList.add('collapsed'); });
      }
    }

    // Touch event handlers (always registered; guarded by DeviceMode.current)
    touchpad.addEventListener('touchstart', (e) => {
      if (DeviceMode.current !== 'mobile') return;
      var tpkToolbar = document.getElementById('touchpadToolbar');
      if (tpkToolbar && tpkToolbar.contains(e.target)) return;
      e.preventDefault();
        sendUserActivity();

        if (e.touches.length === 2) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
          dragMode = false;
          moveAllowed = false;
          lastTouchPos = null;
          momentumActive = false;
          setCursorMode(null);
          hideModeBadge();
          const t0 = e.touches[0];
          const t1 = e.touches[1];
          twoFingerStartPos = {
            lastMidX: (t0.clientX + t1.clientX) / 2,
            lastMidY: (t0.clientY + t1.clientY) / 2,
          };
          lastMoveTime = Date.now();
          return;
        }

        if (e.touches.length === 1) {
          if (Date.now() < moveCooldownUntil) return;
          updateScreenRect();
          moveAllowed = true;
          setCursorMode('move');
          showModeBadge('MOVE', 'rgba(68, 140, 255, 0.7)');
          const t = e.touches[0];
          lastTouchPos = { x: t.clientX, y: t.clientY };
          lastMoveTime = Date.now();
          touchMoved = false;

          clearTimeout(longPressTimer);
          clearTimeout(longPressHintTimer);
          longPressTimer = setTimeout(() => {
            longPressTimer = null;
            longPressHintTimer = null;
            dragMode = true;
            isMouseDown = true;
            touchMoved = true;
            setCursorMode('drag');
            showModeBadge('DRAG', 'rgba(255, 165, 0, 0.8)');
            const pagePos = screenToPage(cursorPos.x, cursorPos.y);
            safeSend(JSON.stringify({
              type: 'input_mouse',
              eventType: 'mousePressed',
              x: pagePos.x,
              y: pagePos.y,
              button: 'left',
              clickCount: 1,
              modifiers: 0
            }));
          }, LONG_PRESS_MS);
        }
      }, { passive: false });

      touchpad.addEventListener('touchend', (e) => {
      if (DeviceMode.current !== 'mobile') return;
      e.preventDefault();
        clearTimeout(longPressTimer);
        clearTimeout(longPressHintTimer);
        if (e.touches.length === 0) {
          if (twoFingerStartPos) {
            moveCooldownUntil = Date.now() + COOLDOWN_MS;
            if (Math.abs(lastWheelDeltaX) > 2 || Math.abs(lastWheelDeltaY) > 2) {
              startMomentum();
            }
          }
          moveAllowed = false;
          setCursorMode(null);
          hideModeBadge();
          if (dragMode) {
            const pagePos = screenToPage(cursorPos.x, cursorPos.y);
            safeSend(JSON.stringify({
              type: 'input_mouse',
              eventType: 'mouseReleased',
              x: pagePos.x,
              y: pagePos.y,
              button: 'left',
              clickCount: 1,
              modifiers: 0
            }));
            dragMode = false;
            isMouseDown = false;
          } else if (!touchMoved) {
            // Single tap/click: send click event, then attempt focus
            const pagePos = screenToPage(cursorPos.x, cursorPos.y);
            
            safeSend(JSON.stringify({
              type: 'input_mouse',
              eventType: 'mousePressed',
              x: pagePos.x,
              y: pagePos.y,
              button: 'left',
              clickCount: 1,
              modifiers: 0
            }));
            safeSend(JSON.stringify({
              type: 'input_mouse',
              eventType: 'mouseReleased',
              x: pagePos.x,
              y: pagePos.y,
              button: 'left',
              clickCount: 1,
              modifiers: 0
            }));


          }
          lastTouchPos = null;
          twoFingerStartPos = null;
          touchMoved = false;
        }
      }, { passive: false });

      touchpad.addEventListener('touchmove', (e) => {
        if (DeviceMode.current !== 'mobile') return;
        e.preventDefault();

        if (e.touches.length === 2 && twoFingerStartPos) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
          dragMode = false;
          moveAllowed = false;
          lastTouchPos = null;
          const t0 = e.touches[0];
          const t1 = e.touches[1];
          const midX = (t0.clientX + t1.clientX) / 2;
          const midY = (t0.clientY + t1.clientY) / 2;
          const rawDX = midX - twoFingerStartPos.lastMidX;
          const rawDY = midY - twoFingerStartPos.lastMidY;
          const wMult = computeWheelAccel(rawDX, rawDY);
          const deltaX = rawDX * wMult;
          const deltaY = rawDY * wMult;
          lastWheelDeltaX = deltaX;
          lastWheelDeltaY = deltaY;
          const pagePos = screenToPage(cursorPos.x, cursorPos.y);
          safeSend(JSON.stringify({
            type: 'input_mouse',
            eventType: 'mouseWheel',
            x: pagePos.x,
            y: pagePos.y,
            deltaX: deltaX,
            deltaY: deltaY,
            modifiers: 0
          }));
          twoFingerStartPos.lastMidX = midX;
          twoFingerStartPos.lastMidY = midY;
          return;
        }

        if (e.touches.length === 1 && lastTouchPos && moveAllowed) {
          const t = e.touches[0];
          const dx = t.clientX - lastTouchPos.x;
          const dy = t.clientY - lastTouchPos.y;

          if (!touchMoved && Math.sqrt(dx * dx + dy * dy) > MOVE_THRESHOLD) {
            touchMoved = true;
            clearTimeout(longPressTimer);
            clearTimeout(longPressHintTimer);
            longPressTimer = null;
            longPressHintTimer = null;
            setCursorMode('move');
            showModeBadge('MOVE', 'rgba(68, 140, 255, 0.7)');
          }

          lastTouchPos = { x: t.clientX, y: t.clientY };

          if (touchMoved) {
            sendUserActivity();
            updateScreenRect();
            const accel = computeAcceleration(dx, dy);
            cursorPos.x = clampCursor(cursorPos.x + dx * accel, screenRect.left, screenRect.right);
            cursorPos.y = clampCursor(cursorPos.y + dy * accel, screenRect.top, screenRect.bottom);
            updateCursor();

            const pagePos = screenToPage(cursorPos.x, cursorPos.y);

            safeSend(JSON.stringify({
              type: 'input_mouse',
              eventType: 'mouseMoved',
              x: pagePos.x,
              y: pagePos.y,
              button: dragMode ? 'left' : 'none',
              clickCount: 1,
              modifiers: 0
            }));
          }
        }
      }, { passive: false });

      touchpad.addEventListener('touchcancel', () => {
        if (DeviceMode.current !== 'mobile') return;
        clearTimeout(longPressTimer);
        clearTimeout(longPressHintTimer);
        momentumActive = false;
        if (dragMode) {
          const pagePos = screenToPage(cursorPos.x, cursorPos.y);
          safeSend(JSON.stringify({
            type: 'input_mouse',
            eventType: 'mouseReleased',
            x: pagePos.x,
            y: pagePos.y,
            button: 'left',
            clickCount: 1,
            modifiers: 0
          }));
        }
        dragMode = false;
        isMouseDown = false;
        moveAllowed = false;
        setCursorMode(null);
        hideModeBadge();
        moveCooldownUntil = twoFingerStartPos ? Date.now() + COOLDOWN_MS : 0;
        lastTouchPos = null;
        twoFingerStartPos = null;
        touchMoved = false;
      }, { passive: false });
    
    var inputSendBtn = document.getElementById('input-send');
    if (inputSendBtn) inputSendBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      sendInputText();
    });

    document.addEventListener('pointerdown', function(e) {
      if (!inputMode) return;
      var panel = document.getElementById('input-panel');
      if (panel && !panel.contains(e.target)) {
        exitInputMode();
      }
    });

    var inputField = document.getElementById('input-field');
    if (inputField) {
      inputField.addEventListener('input', function(e) {
        if (window._fieldComposing) return;
        syncInputToRemote(inputField);
      });
      inputField.addEventListener('compositionend', function(e) {
        window._fieldComposing = false;
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            syncInputToRemote(inputField);
          });
        });
      });
      inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendInputText();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          exitInputMode();
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
          // Let it fall through - the field value will change,
          // then syncInputToRemote will pick up the change and send input_fill
        }
      });
    }
    
    // Image sizing: re-fit on container resize (phone rotation, window resize)
    var resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        fitImageToContainer();
        DeviceMode.autoDetectAndSwitch();
      }, 100);
    });

    window.addEventListener('orientationchange', () => {
      setTimeout(function() {
        DeviceMode.autoDetectAndSwitch();
      }, 200);
    });

    // matchMedia pointer:coarse as additional trigger
    if (window.matchMedia) {
      try {
        var mql = window.matchMedia('(pointer:coarse)');
        if (mql && typeof mql.addEventListener === 'function') {
          mql.addEventListener('change', function(e) {
            var newMode = e.matches ? 'mobile' : 'desktop';
            DeviceMode.switchTo(newMode);
          });
        }
      } catch(err) {}
    }

    // Recorder functionality
    const recordBtn = document.getElementById('recordBtn');
    const recordText = document.getElementById('recordText');

    recordBtn.onclick = () => {
      if (isRecording) {
        // Stop recording
        safeSend(JSON.stringify({ id: 'recorder-stop-' + Date.now(), action: 'recorder_stop' }));
      } else {
        // Start recording
        safeSend(JSON.stringify({ id: 'recorder-start-' + Date.now(), action: 'recorder_start' }));
      }
    };

    // Page visibility management
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // Page going to background: stop reconnect attempts
        shouldReconnect = false;

        // Start background timer - disconnect after timeout
        backgroundTimer = setTimeout(() => {
          if (ws && ws.readyState === 1) {
            ws.close(1000, 'Page in background');
          }
        }, BACKGROUND_TIMEOUT);
      } else {
        // Page coming back to foreground
        shouldReconnect = true;

        // Clear background timer if page is visible again
        if (backgroundTimer) {
          clearTimeout(backgroundTimer);
          backgroundTimer = null;
        }

        // Reconnect immediately if disconnected
        if (!ws || ws.readyState === 3) {
          connect();
        }
      }
    });

    if (DeviceMode.current === 'desktop') focusHiddenInput();
    connect();

  </script>
</body>
