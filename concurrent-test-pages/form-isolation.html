<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scenario 1: Form Isolation</title>
  <style>
    body { font-family: monospace; max-width: 700px; margin: 40px auto; padding: 20px; }
    .field { margin: 12px 0; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; font-family: monospace; }
    button { padding: 10px 24px; font-size: 16px; cursor: pointer; margin-top: 12px; }
    #result { margin-top: 20px; padding: 16px; border: 2px solid #333; white-space: pre-wrap; display: none; }
    .badge { display: inline-block; background: #eee; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>Scenario 1: Form Isolation Test</h1>
  <p>Each agent should fill in <strong>unique data</strong> matching its session identity.</p>

  <div class="field">
    <label for="username">Username:</label>
    <input type="text" id="username" placeholder="Enter your agent session name">
  </div>
  <div class="field">
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Enter email">
  </div>
  <div class="field">
    <label for="color">Favorite Color:</label>
    <select id="color">
      <option value="">-- pick one --</option>
      <option value="red">Red</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
      <option value="yellow">Yellow</option>
    </select>
  </div>
  <div class="field">
    <label for="comment">Comment:</label>
    <textarea id="comment" rows="3" placeholder="Write something"></textarea>
  </div>
  <div class="field">
    <label>
      <input type="checkbox" id="agree"> I agree to the terms
    </label>
  </div>
  <div class="field">
    <label>Rating:</label>
    <input type="radio" name="rating" value="1"> 1
    <input type="radio" name="rating" value="2"> 2
    <input type="radio" name="rating" value="3"> 3
    <input type="radio" name="rating" value="4"> 4
    <input type="radio" name="rating" value="5"> 5
  </div>
  <button id="submit-btn" disabled>Submit (check "agree" first)</button>

  <div id="result"></div>

  <script>
    const agree = document.getElementById('agree');
    const btn = document.getElementById('submit-btn');
    agree.addEventListener('change', () => { btn.disabled = !agree.checked; });

    btn.addEventListener('click', () => {
      const data = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        color: document.getElementById('color').value,
        comment: document.getElementById('comment').value,
        agreed: agree.checked,
        rating: document.querySelector('input[name="rating"]:checked')?.value || 'none'
      };
      const el = document.getElementById('result');
      el.style.display = 'block';
      el.textContent = '=== SUBMISSION RESULT ===\n' + JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
