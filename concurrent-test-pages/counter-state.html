<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scenario 2: Counter State Isolation</title>
  <style>
    body { font-family: monospace; max-width: 700px; margin: 40px auto; padding: 20px; }
    #counter-display { font-size: 64px; text-align: center; margin: 30px 0; }
    .btn-group { display: flex; gap: 12px; justify-content: center; }
    button { padding: 12px 28px; font-size: 18px; cursor: pointer; }
    #log { margin-top: 24px; padding: 12px; border: 1px solid #ccc; max-height: 200px; overflow-y: auto; font-size: 13px; }
    .pass { color: green; } .fail { color: red; }
  </style>
</head>
<body>
  <h1>Scenario 2: Counter State Isolation</h1>
  <p>Each agent should set the counter to its <strong>unique session number</strong> and verify.</p>

  <div id="counter-display">0</div>
  <div class="btn-group">
    <button id="btn-inc">+1</button>
    <button id="btn-dec">-1</button>
    <button id="btn-reset">Reset to 0</button>
    <button id="btn-set">Set Value</button>
  </div>
  <div style="text-align: center; margin-top: 12px;">
    <input type="number" id="set-value" placeholder="Enter value" style="width: 120px; padding: 8px; font-size: 16px;">
  </div>
  <div id="log"></div>

  <script>
    let counter = 0;
    const display = document.getElementById('counter-display');
    const logEl = document.getElementById('log');

    function render() { display.textContent = counter; }
    function log(msg) {
      const p = document.createElement('div');
      p.textContent = `[${new Date().toISOString()}] ${msg}`;
      logEl.prepend(p);
    }

    document.getElementById('btn-inc').addEventListener('click', () => { counter++; render(); log('inc -> ' + counter); });
    document.getElementById('btn-dec').addEventListener('click', () => { counter--; render(); log('dec -> ' + counter); });
    document.getElementById('btn-reset').addEventListener('click', () => { counter = 0; render(); log('reset'); });
    document.getElementById('btn-set').addEventListener('click', () => {
      const v = parseInt(document.getElementById('set-value').value, 10);
      if (!isNaN(v)) { counter = v; render(); log('set -> ' + counter); }
    });
  </script>
</body>
</html>
