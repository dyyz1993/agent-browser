<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edge F: Sticky Header + Scroll Tabs</title>
  <style>
    body { font-family: monospace; max-width: 700px; margin: 0 auto; padding: 0; }
    .sticky-header { position: sticky; top: 0; background: white; z-index: 10; border-bottom: 2px solid #333; padding: 12px 20px; }
    .tabs { display: flex; gap: 0; margin-top: 8px; }
    .tab { padding: 8px 16px; border: 1px solid #ccc; cursor: pointer; border-bottom: none; background: #f5f5f5; }
    .tab.active { background: white; border-bottom: 2px solid white; font-weight: bold; }
    .tab-panel { display: none; padding: 20px; min-height: 800px; }
    .tab-panel.active { display: block; }
    .field { margin: 10px 0; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, textarea { padding: 8px; width: 100%; box-sizing: border-box; font-family: monospace; }
    .save-indicator { color: green; font-size: 13px; opacity: 0; transition: opacity 0.3s; }
    .save-indicator.show { opacity: 1; }
    .accordion { margin: 8px 0; border: 1px solid #ddd; }
    .accordion-header { padding: 12px; background: #f5f5f5; cursor: pointer; display: flex; justify-content: space-between; }
    .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; padding: 0 12px; }
    .accordion.open .accordion-body { max-height: 300px; padding: 12px; }
    .accordion.open .arrow { transform: rotate(180deg); }
    button { padding: 8px 16px; cursor: pointer; }
    #final { margin: 20px; padding: 16px; border: 2px solid green; display: none; white-space: pre-wrap; }
    #content-area { padding: 0 20px; }
  </style>
</head>
<body>
  <div class="sticky-header">
    <h1 style="margin:0">Edge F: Sticky + Tabs + Accordion</h1>
    <div class="tabs">
      <div class="tab active" data-tab="profile">Profile</div>
      <div class="tab" data-tab="details">Details</div>
      <div class="tab" data-tab="settings">Settings</div>
      <div class="tab" data-tab="review">Review</div>
    </div>
  </div>

  <div id="content-area">
    <div class="tab-panel active" id="panel-profile">
      <h2>Profile Tab</h2>
      <p class="save-indicator" id="save-ind-1">Auto-saved!</p>
      <div class="field">
        <label>Display Name</label>
        <input type="text" id="p-name" class="auto-save" data-field="name">
      </div>
      <div class="field">
        <label>Title</label>
        <input type="text" id="p-title" class="auto-save" data-field="title">
      </div>
    </div>

    <div class="tab-panel" id="panel-details">
      <h2>Details Tab (Accordion)</h2>

      <div class="accordion" id="acc-1">
        <div class="accordion-header" onclick="toggleAccordion('acc-1')">
          <span>Work Experience</span><span class="arrow">&#9660;</span>
        </div>
        <div class="accordion-body">
          <div class="field">
            <label>Company</label>
            <input type="text" id="d-company" class="auto-save" data-field="company">
          </div>
          <div class="field">
            <label>Years</label>
            <input type="number" id="d-years" class="auto-save" data-field="years">
          </div>
        </div>
      </div>

      <div class="accordion" id="acc-2">
        <div class="accordion-header" onclick="toggleAccordion('acc-2')">
          <span>Education</span><span class="arrow">&#9660;</span>
        </div>
        <div class="accordion-body">
          <div class="field">
            <label>University</label>
            <input type="text" id="d-university" class="auto-save" data-field="university">
          </div>
          <div class="field">
            <label>Degree</label>
            <input type="text" id="d-degree" class="auto-save" data-field="degree">
          </div>
        </div>
      </div>

      <div class="accordion" id="acc-3">
        <div class="accordion-header" onclick="toggleAccordion('acc-3')">
          <span>Skills</span><span class="arrow">&#9660;</span>
        </div>
        <div class="accordion-body">
          <div class="field">
            <label>Primary Skill</label>
            <input type="text" id="d-skill1" class="auto-save" data-field="skill1">
          </div>
          <div class="field">
            <label>Secondary Skill</label>
            <input type="text" id="d-skill2" class="auto-save" data-field="skill2">
          </div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="panel-settings">
      <h2>Settings Tab</h2>
      <p class="save-indicator" id="save-ind-3">Auto-saved!</p>
      <div class="field">
        <label>Theme</label>
        <select id="s-theme" style="padding:8px;width:100%;font-family:monospace;">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="auto">Auto</option>
        </select>
      </div>
      <div class="field">
        <label>Notifications</label>
        <input type="checkbox" id="s-notif" checked> Enable notifications
      </div>
      <div class="field">
        <label>Language</label>
        <select id="s-lang" style="padding:8px;width:100%;font-family:monospace;">
          <option value="en">English</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
        </select>
      </div>
    </div>

    <div class="tab-panel" id="panel-review">
      <h2>Review Tab</h2>
      <div id="review-summary" style="padding: 12px; border: 1px solid #ccc; white-space: pre-wrap;">Fill all tabs first...</div>
      <div style="margin-top: 12px;">
        <button id="btn-final-submit">Submit All</button>
      </div>
    </div>
  </div>

  <div id="final"></div>

  <script>
    const formData = {};

    function toggleAccordion(id) {
      const el = document.getElementById(id);
      el.classList.toggle('open');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');

        if (tab.dataset.tab === 'review') updateReview();
      });
    });

    function updateReview() {
      const el = document.getElementById('review-summary');
      el.textContent = JSON.stringify(formData, null, 2);
    }

    // Auto-save with debounce
    let saveTimer = null;
    document.querySelectorAll('.auto-save').forEach(input => {
      input.addEventListener('input', () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          formData[input.dataset.field] = input.value;
          const ind = input.closest('.tab-panel')?.querySelector('.save-indicator');
          if (ind) {
            ind.classList.add('show');
            setTimeout(() => ind.classList.remove('show'), 1500);
          }
        }, 500);
      });
    });

    document.getElementById('btn-final-submit').addEventListener('click', () => {
      const el = document.getElementById('final');
      el.style.display = 'block';
      el.textContent = '=== ALL DATA SUBMITTED ===\n' + JSON.stringify({
        ...formData,
        theme: document.getElementById('s-theme').value,
        notifications: document.getElementById('s-notif').checked,
        language: document.getElementById('s-lang').value,
        submittedAt: new Date().toISOString()
      }, null, 2);
    });
  </script>
</body>
</html>
