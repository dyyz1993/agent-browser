name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version sync
        run: node scripts/check-version-sync.js

  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Set Chromium path
        run: |
          CHROMIUM_PATH=$(node -e "
            try {
              const { chromium } = require('playwright-core');
              console.log(chromium.executablePath());
            } catch(e) {
              console.error(e.message);
            }
          " 2>/dev/null || true)
          if [ -z "$CHROMIUM_PATH" ] || [ ! -f "$CHROMIUM_PATH" ]; then
            CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -type f -name "chrome" -o -name "chromium" 2>/dev/null | head -1 || true)
          fi
          if [ -n "$CHROMIUM_PATH" ]; then
            echo "AGENT_BROWSER_EXECUTABLE_PATH=$CHROMIUM_PATH" >> $GITHUB_ENV
            echo "Chromium path: $CHROMIUM_PATH"
          else
            echo "Warning: Could not find Chromium path"
          fi
        shell: bash

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration
        continue-on-error: true

  e2e-snapshot:
    name: E2E Snapshot Selector Tests
    needs: version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript
        run: npx tsc

      - name: Set Chromium path
        run: |
          CHROMIUM_PATH=$(node -e "
            try {
              const { chromium } = require('playwright-core');
              console.log(chromium.executablePath());
            } catch(e) {
              console.error(e.message);
            }
          " 2>/dev/null || true)
          if [ -z "$CHROMIUM_PATH" ] || [ ! -f "$CHROMIUM_PATH" ]; then
            CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -type f -name "chrome" -o -name "chromium" 2>/dev/null | head -1 || true)
          fi
          if [ -n "$CHROMIUM_PATH" ]; then
            echo "AGENT_BROWSER_EXECUTABLE_PATH=$CHROMIUM_PATH" >> $GITHUB_ENV
            echo "Chromium path: $CHROMIUM_PATH"
          else
            echo "Warning: Could not find Chromium path"
          fi
        shell: bash

      - name: Run E2E snapshot selector tests
        run: pnpm test:e2e

  exporter-tests:
    name: Exporter Tests
    needs: typescript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run exporter tests
        run: pnpm exec vitest run src/__tests__/flow-exporters.test.ts src/__tests__/flow-cypress-selenium.test.ts --reporter=verbose

  healing-config-tests:
    name: Healing Config Tests
    needs: typescript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run healing config tests
        run: pnpm exec vitest run src/__tests__/flow-self-healing.test.ts src/__tests__/flow-healing-config.test.ts src/__tests__/flow-env-signals.test.ts --reporter=verbose

  benchmark-tests:
    name: Benchmark Tests
    needs: typescript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run benchmark tests
        run: pnpm exec vitest run src/__tests__/benchmark-selector-generation.test.ts --reporter=verbose

  e2e-self-healing:
    name: E2E Self-Healing Tests
    needs: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          echo "AGENT_BROWSER_EXECUTABLE_PATH=$(which chromium-browser)" >> $GITHUB_ENV
      - name: Run E2E self-healing tests
        run: pnpm exec vitest run --config vitest.integration.config.ts src/__tests__/e2e/self-healing-replay.e2e.test.ts --reporter=verbose

  rust:
    name: Rust (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cli/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Run Rust tests
        run: cargo test --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

  windows-integration:
    name: Windows Integration Test
    runs-on: windows-latest
    needs: rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cli/target/
          key: windows-cargo-x86_64-pc-windows-msvc-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            windows-cargo-x86_64-pc-windows-msvc-

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: pnpm install

      - name: Build TypeScript
        run: pnpm build

      - name: Copy CLI binary to bin directory
        run: |
          Copy-Item cli/target/x86_64-pc-windows-msvc/release/agent-browser.exe bin/agent-browser-win32-x64.exe

      - name: Test agent-browser install command
        run: |
          $env:PATH = "$pwd\bin;$env:PATH"
          for ($i = 1; $i -le 3; $i++) {
            bin/agent-browser-win32-x64.exe install
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i failed, retrying in 10 seconds..."
            Start-Sleep -Seconds 10
          }
          exit 1
        shell: pwsh
        timeout-minutes: 10

      - name: Verify Chromium was installed
        run: |
          $playwrightPath = "$env:LOCALAPPDATA\ms-playwright"
          if (Test-Path $playwrightPath) {
            Write-Host "Playwright browsers installed at: $playwrightPath"
            Get-ChildItem $playwrightPath -Recurse -Depth 2 | Select-Object -First 20
          } else {
            Write-Error "Playwright browsers not found!"
            exit 1
          }
        shell: pwsh

  serverless-chromium:
    name: Serverless Chromium (@sparticuz/chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Install @sparticuz/chromium
        run: pnpm add -D @sparticuz/chromium

      - name: Build TypeScript
        run: pnpm build

      - name: Run serverless integration test
        run: pnpm exec vitest run test/serverless.test.ts --config vitest.integration.config.ts

  global-install:
    name: Global Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: agent-browser-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: agent-browser-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: agent-browser-win32-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cli/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Install npm dependencies
        run: pnpm install

      - name: Build TypeScript
        run: pnpm build

      - name: Copy CLI binary to bin directory (Unix)
        if: runner.os != 'Windows'
        run: cp cli/target/${{ matrix.target }}/release/agent-browser bin/${{ matrix.binary }}

      - name: Copy CLI binary to bin directory (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item cli/target/${{ matrix.target }}/release/agent-browser.exe bin/${{ matrix.binary }}

      - name: Test npm global install
        run: |
          npm pack
          npm install -g dyyz1993-agent-browser-*.tgz
          agent-browser --version
        shell: bash

      - name: Verify native binary is used
        run: |
          agent-browser --version
          echo "✓ agent-browser installed and working via native binary wrapper"
        shell: bash

  scrape-crawl-e2e:
    name: Scrape/Crawl/Map E2E Tests
    needs: version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript
        run: pnpm build

      - name: Set Chromium path
        run: |
          CHROMIUM_PATH=$(node -e "
            try {
              const { chromium } = require('playwright-core');
              console.log(chromium.executablePath());
            } catch(e) {
              console.error(e.message);
            }
          " 2>/dev/null || true)
          if [ -z "$CHROMIUM_PATH" ] || [ ! -f "$CHROMIUM_PATH" ]; then
            CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -type f -name "chrome" -o -name "chromium" 2>/dev/null | head -1 || true)
          fi
          if [ -n "$CHROMIUM_PATH" ]; then
            echo "AGENT_BROWSER_EXECUTABLE_PATH=$CHROMIUM_PATH" >> $GITHUB_ENV
            echo "Chromium path: $CHROMIUM_PATH"
          else
            echo "Warning: Could not find Chromium path"
          fi
        shell: bash

      - name: Run Scrape/Crawl/Map E2E tests
        run: pnpm test:e2e:crawl

  feishu-notify:
    name: Feishu Notification
    if: always()
    needs: [typescript, rust, windows-integration, serverless-chromium, global-install, e2e-snapshot, exporter-tests, healing-config-tests, benchmark-tests, e2e-self-healing, scrape-crawl-e2e]
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"typescript":"${{ needs.typescript.result }}","rust":"${{ needs.rust.result }}","windows":"${{ needs.windows-integration.result }}","serverless":"${{ needs.serverless-chromium.result }}","global":"${{ needs.global-install.result }}","e2e-snapshot":"${{ needs.e2e-snapshot.result }}","exporter":"${{ needs.exporter-tests.result }}","healing":"${{ needs.healing-config-tests.result }}","benchmark":"${{ needs.benchmark-tests.result }}","e2e-self-healing":"${{ needs.e2e-self-healing.result }}","scrape-crawl":"${{ needs.scrape-crawl-e2e.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
